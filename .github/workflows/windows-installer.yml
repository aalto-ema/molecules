name: Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-installer.yml
      - packaging/windows/**
      - src/**
      - pyproject.toml
      - LICENSE

permissions:
  contents: read

jobs:
  installer:
    name: Build and test Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows/requirements.txt
      - name: Install packaging dependencies
        run: python -m pip install . -r packaging/windows/requirements.txt
      - name: Build installer
        id: build
        run: ./packaging/windows/build.ps1
      - name: Install, run, and uninstall
        env:
          INSTALLER_PATH: ${{ steps.build.outputs.installer }}
        run: ./packaging/windows/test-installer.ps1
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: Molecules-windows-x64-installer
          path: |
            ${{ steps.build.outputs.installer }}
            ${{ steps.build.outputs.installer }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
